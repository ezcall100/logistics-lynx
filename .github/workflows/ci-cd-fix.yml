# ========================
# 🔧 CI/CD Pipeline Fix - Resolves Cancellation Issues
# ========================

name: 🔧 CI/CD Pipeline Fix

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if higher priority exists'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  FORCE_RUN: ${{ github.event.inputs.force_run == 'true' }}

jobs:
  # ========================
  # 🔍 Pre-flight Checks
  # ========================
  preflight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      priority_level: ${{ steps.check.outputs.priority_level }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pipeline priority
        id: check
        run: |
          # Determine if this pipeline should run
          BRANCH="${{ github.ref_name }}"
          FORCE_RUN="${{ env.FORCE_RUN }}"

          # Set priority levels
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            PRIORITY="critical"
            SHOULD_RUN="true"
          elif [[ "$BRANCH" == "develop" ]]; then
            PRIORITY="high"
            SHOULD_RUN="true"
          elif [[ "$BRANCH" == feature/* ]]; then
            PRIORITY="medium"
            SHOULD_RUN="true"
          else
            PRIORITY="low"
            SHOULD_RUN="false"
          fi

          # Override if force run is enabled
          if [[ "$FORCE_RUN" == "true" ]]; then
            SHOULD_RUN="true"
            PRIORITY="forced"
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "priority_level=$PRIORITY" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH, Priority: $PRIORITY, Should Run: $SHOULD_RUN"

  # ========================
  # 🔍 Code Quality & Security
  # ========================
  quality-check:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate || true
          echo "Security audit completed"

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

  # ========================
  # 🏗️ Build & Package
  # ========================
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [preflight, quality-check]
    if: needs.preflight.outputs.should_run == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            dist/
            build/
          retention-days: 30

  # ========================
  # 🚀 Deployment (Conditional)
  # ========================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.should_run == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "Build artifacts downloaded and ready for deployment"
          # Add actual deployment logic here

  # ========================
  # 📊 Pipeline Summary
  # ========================
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [preflight, quality-check, build, deploy]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-flight Check | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Check | ${{ needs.quality-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Priority Level:** ${{ needs.preflight.outputs.priority_level }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
