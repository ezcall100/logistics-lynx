version: '3.8'

services:
  # Super Admin Portal
  super-admin-portal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_APP_ENVIRONMENT=production
    volumes:
      - ./dist:/app/dist
    restart: unless-stopped
    networks:
      - transbot-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - super-admin-portal
    restart: unless-stopped
    networks:
      - transbot-network

  # MCP API Server
  mcp-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${VITE_SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${VITE_OPENAI_API_KEY}
    restart: unless-stopped
    networks:
      - transbot-network

networks:
  transbot-network:
    driver: bridge

volumes:
  ssl-certs:
    external: true