<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Login - Trans Bot AI</title>
    <style>
      /* Ensure no website elements are visible */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: #f8fafc !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
      }
      
      /* Hide any potential website elements */
      header, nav, .fab, .floating-action-button, .horizontal-mega-menu,
      .website-header, .website-footer, .mega-menu, .fab-container,
      .website-nav, .main-header, .navigation, .top-bar, .header-container,
      .navbar, .nav-container, .neural-background, .background-animation {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
      }
      
      /* Ensure portal root takes full control */
      #root {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 999999 !important;
        background: #f8fafc !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
