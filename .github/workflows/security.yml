# ========================
# 🔒 TransBot AI - Security Scanning & Vulnerability Assessment
# ========================

name: Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - dependency
          - code
          - infrastructure
          - full

env:
  NODE_VERSION: '20.14.0'

jobs:
  # ========================
  # 🔍 Dependency Vulnerability Scan
  # ========================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'dependency' || inputs.scan_type == 'full'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit
        run: |
          echo "🔍 Running npm security audit..."
          npm audit --audit-level=moderate || echo "⚠️ Security vulnerabilities found"

      - name: Run npm audit fix (dry run)
        run: |
          echo "🔍 Checking for auto-fixable vulnerabilities..."
          npm audit fix --dry-run || echo "No auto-fixable vulnerabilities found"

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for known security issues..."
          if npm audit --audit-level=moderate 2>/dev/null; then
            echo "✅ No critical vulnerabilities found"
          else
            echo "❌ Critical vulnerabilities detected"
            echo "VULNERABILITIES_FOUND=true" >> $GITHUB_ENV
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: |
            package-lock.json
            node_modules/.package-lock.json
          retention-days: 30

  # ========================
  # 🔍 Code Security Scan
  # ========================
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'code' || inputs.scan_type == 'full'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint security rules
        run: |
          echo "🔍 Running ESLint security analysis..."
          npm run lint:security || echo "⚠️ Security linting issues found"

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential hardcoded secrets..."
          
          # Check for common secret patterns
          if grep -r -i "password\|secret\|key\|token" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/ | grep -v "// TODO\|// FIXME\|process.env"; then
            echo "⚠️ Potential hardcoded secrets found"
            echo "SECRETS_FOUND=true" >> $GITHUB_ENV
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Check for unsafe dependencies
        run: |
          echo "🔍 Checking for unsafe dependency usage..."
          
          # Check for eval usage
          if grep -r "eval(" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "⚠️ eval() usage detected - potential security risk"
            echo "UNSAFE_CODE=true" >> $GITHUB_ENV
          fi
          
          # Check for innerHTML usage
          if grep -r "innerHTML" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "⚠️ innerHTML usage detected - potential XSS risk"
            echo "UNSAFE_CODE=true" >> $GITHUB_ENV
          fi

  # ========================
  # 🔍 Infrastructure Security Scan
  # ========================
  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scan_type == 'infrastructure' || inputs.scan_type == 'full'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dockerfile Security Scan
        run: |
          echo "🔍 Scanning Dockerfile for security issues..."
          
          if [ -f "Dockerfile" ]; then
            # Check for running as root
            if grep -q "USER root" Dockerfile; then
              echo "⚠️ Dockerfile runs as root - security risk"
              echo "DOCKER_SECURITY_ISSUE=true" >> $GITHUB_ENV
            fi
            
            # Check for latest tags
            if grep -q ":latest" Dockerfile; then
              echo "⚠️ Dockerfile uses 'latest' tag - version pinning recommended"
              echo "DOCKER_SECURITY_ISSUE=true" >> $GITHUB_ENV
            fi
          else
            echo "ℹ️ No Dockerfile found"
          fi

      - name: Environment Variables Security Check
        run: |
          echo "🔍 Checking environment variable security..."
          
          # Check for sensitive env vars in workflow files
          if grep -r "password\|secret\|key\|token" --include="*.yml" --include="*.yaml" .github/workflows/ | grep -v "secrets\."; then
            echo "⚠️ Potential hardcoded secrets in workflow files"
            echo "WORKFLOW_SECURITY_ISSUE=true" >> $GITHUB_ENV
          else
            echo "✅ Workflow files appear secure"
          fi

      - name: SSL/TLS Configuration Check
        run: |
          echo "🔍 Checking SSL/TLS configuration..."
          
          # Check production URLs for SSL
          for url in "https://www.transbotai.com" "https://mcp.transbotai.com"; do
            if curl -I "$url" 2>/dev/null | grep -q "HTTP/2 200\|HTTP/1.1 200"; then
              echo "✅ $url is accessible via HTTPS"
            else
              echo "⚠️ $url may have SSL issues"
              echo "SSL_ISSUE=true" >> $GITHUB_ENV
            fi
          done

  # ========================
  # 📊 Security Report Generation
  # ========================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, infrastructure-scan]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "📊 Security Scan Summary - $(date)" > security-report.md
          echo "=================================" >> security-report.md
          echo "" >> security-report.md
          echo "## Scan Results" >> security-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- Code Security Scan: ${{ needs.code-scan.result }}" >> security-report.md
          echo "- Infrastructure Scan: ${{ needs.infrastructure-scan.result }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Recommendations" >> security-report.md
          echo "- Review and update dependencies regularly" >> security-report.md
          echo "- Use environment variables for sensitive data" >> security-report.md
          echo "- Implement proper input validation" >> security-report.md
          echo "- Regular security audits and penetration testing" >> security-report.md
          echo "" >> security-report.md
          echo "---" >> security-report.md
          echo "Generated at: $(date)" >> security-report.md
          echo "Workflow: ${{ github.workflow }}" >> security-report.md
          echo "Run ID: ${{ github.run_id }}" >> security-report.md

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: security-report.md
          retention-days: 90

  # ========================
  # 🚨 Security Alerts
  # ========================
  security-alerts:
    name: Send Security Alerts
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, infrastructure-scan]
    if: always() && (needs.dependency-scan.result == 'failure' || needs.code-scan.result == 'failure' || needs.infrastructure-scan.result == 'failure')
    
    steps:
      - name: Send Critical Security Alerts
        run: |
          echo "🚨 CRITICAL SECURITY ALERT!"
          echo "Security scan detected potential vulnerabilities:"
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "- Code Security: ${{ needs.code-scan.result }}"
          echo "- Infrastructure: ${{ needs.infrastructure-scan.result }}"
          
          # Add alerting logic here:
          # - Slack webhook
          # - Email notifications
          # - Security team notifications
          # - Jira ticket creation
          
          echo "Security alerts sent to configured channels"
