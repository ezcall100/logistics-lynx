<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Agents Dashboard - 302 Autonomous Agents</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
        }
        .status-active { background-color: #10b981; }
        .status-idle { background-color: #f59e0b; }
        .status-maintenance { background-color: #3b82f6; }
        .status-error { background-color: #ef4444; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 10px;
        }
        .agent-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin: 8px;
            transition: all 0.3s ease;
        }
        .agent-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = Motion;

        // Mock data for 302 agents
        const generateMockAgents = () => {
            const agents = [];
            const roles = [
                "Strategy Planner", "Test Case Generator", "Form Validator", "Table Tester", 
                "API Validator", "Workflow Tester", "Style Checker", "Vulnerability Scanner", 
                "Penetration Tester", "Release Validator", "Real-Time Validator", "UI Builder",
                "Database Manager", "Security Auditor", "Performance Optimizer", "Integration Specialist"
            ];
            const portals = [
                "Super Admin", "TMS", "CRM", "EDI", "Factoring", "Marketplace",
                "Analytics", "Directory", "Communication Hub", "System Administration",
                "Development & DevOps", "User Management", "MCP Agents", "Global"
            ];
            const statuses = ["active", "idle", "maintenance", "error"];
            const priorities = ["low", "medium", "high", "critical"];

            for (let i = 1; i <= 302; i++) {
                agents.push({
                    id: i,
                    name: `Agent-${i}`,
                    role: roles[i % roles.length],
                    portal: portals[i % portals.length],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    assignedTask: `Task ${i}: ${roles[i % roles.length].toLowerCase()}`,
                    progress: Math.floor(Math.random() * 101),
                    uptime: `${Math.floor(Math.random() * 99) + 1}%`,
                    lastCheckIn: new Date(Date.now() - Math.random() * 3600000).toISOString(),
                    errors: Math.floor(Math.random() * 5),
                    warnings: Math.floor(Math.random() * 10),
                    priority: priorities[i % priorities.length]
                });
            }
            return agents;
        };

        const MCPDashboard = () => {
            const [agents, setAgents] = useState([]);
            const [filter, setFilter] = useState({
                search: '',
                status: 'all',
                portal: 'all'
            });
            const [selectedView, setSelectedView] = useState('grid');
            const [autoRefresh, setAutoRefresh] = useState(true);

            useEffect(() => {
                setAgents(generateMockAgents());
                
                if (autoRefresh) {
                    const interval = setInterval(() => {
                        setAgents(generateMockAgents());
                    }, 5000);
                    return () => clearInterval(interval);
                }
            }, [autoRefresh]);

            const filteredAgents = agents.filter(agent => {
                const matchesSearch = !filter.search || 
                    agent.name.toLowerCase().includes(filter.search.toLowerCase()) ||
                    agent.role.toLowerCase().includes(filter.search.toLowerCase()) ||
                    agent.portal.toLowerCase().includes(filter.search.toLowerCase());
                const matchesStatus = filter.status === 'all' || agent.status === filter.status;
                const matchesPortal = filter.portal === 'all' || agent.portal === filter.portal;
                return matchesSearch && matchesStatus && matchesPortal;
            });

            const stats = {
                total: agents.length,
                active: agents.filter(a => a.status === 'active').length,
                idle: agents.filter(a => a.status === 'idle').length,
                maintenance: agents.filter(a => a.status === 'maintenance').length,
                error: agents.filter(a => a.status === 'error').length
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'active': return 'status-active';
                    case 'idle': return 'status-idle';
                    case 'maintenance': return 'status-maintenance';
                    case 'error': return 'status-error';
                    default: return 'bg-gray-500';
                }
            };

            return (
                <div className="min-h-screen p-6">
                    {/* Header */}
                    <div className="mb-8">
                        <div className="flex items-center justify-between mb-4">
                            <div>
                                <h1 className="text-4xl font-bold mb-2">🤖 MCP Agents Dashboard</h1>
                                <p className="text-xl text-gray-300">302 Autonomous Agents • 24/7 Runtime • Full Lifecycle Coverage</p>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button
                                    onClick={() => setAutoRefresh(!autoRefresh)}
                                    className={`px-4 py-2 rounded-lg ${autoRefresh ? 'bg-green-600' : 'bg-gray-600'} text-white`}
                                >
                                    {autoRefresh ? '🔄 Auto Refresh ON' : '⏸️ Auto Refresh OFF'}
                                </button>
                            </div>
                        </div>

                        {/* Stats Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                            <div className="card">
                                <div className="text-3xl font-bold text-green-400">{stats.total}</div>
                                <div className="text-gray-300">Total Agents</div>
                            </div>
                            <div className="card">
                                <div className="text-3xl font-bold text-green-400">{stats.active}</div>
                                <div className="text-gray-300">Active</div>
                            </div>
                            <div className="card">
                                <div className="text-3xl font-bold text-yellow-400">{stats.idle}</div>
                                <div className="text-gray-300">Idle</div>
                            </div>
                            <div className="card">
                                <div className="text-3xl font-bold text-blue-400">{stats.maintenance}</div>
                                <div className="text-gray-300">Maintenance</div>
                            </div>
                            <div className="card">
                                <div className="text-3xl font-bold text-red-400">{stats.error}</div>
                                <div className="text-gray-300">Error</div>
                            </div>
                        </div>

                        {/* Filters */}
                        <div className="card mb-6">
                            <div className="flex flex-wrap items-center gap-4">
                                <input
                                    type="text"
                                    placeholder="Search agents..."
                                    value={filter.search}
                                    onChange={(e) => setFilter({...filter, search: e.target.value})}
                                    className="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400"
                                />
                                <select
                                    value={filter.status}
                                    onChange={(e) => setFilter({...filter, status: e.target.value})}
                                    className="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white"
                                >
                                    <option value="all">All Status</option>
                                    <option value="active">Active</option>
                                    <option value="idle">Idle</option>
                                    <option value="maintenance">Maintenance</option>
                                    <option value="error">Error</option>
                                </select>
                                <select
                                    value={filter.portal}
                                    onChange={(e) => setFilter({...filter, portal: e.target.value})}
                                    className="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white"
                                >
                                    <option value="all">All Portals</option>
                                    <option value="Super Admin">Super Admin</option>
                                    <option value="TMS">TMS</option>
                                    <option value="CRM">CRM</option>
                                    <option value="EDI">EDI</option>
                                    <option value="Factoring">Factoring</option>
                                    <option value="Marketplace">Marketplace</option>
                                </select>
                                <div className="flex space-x-2">
                                    <button
                                        onClick={() => setSelectedView('grid')}
                                        className={`px-4 py-2 rounded-lg ${selectedView === 'grid' ? 'bg-blue-600' : 'bg-gray-600'} text-white`}
                                    >
                                        Grid
                                    </button>
                                    <button
                                        onClick={() => setSelectedView('list')}
                                        className={`px-4 py-2 rounded-lg ${selectedView === 'list' ? 'bg-blue-600' : 'bg-gray-600'} text-white`}
                                    >
                                        List
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Agents Grid/List */}
                    <div className={selectedView === 'grid' ? 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4' : 'space-y-2'}>
                        <AnimatePresence>
                            {filteredAgents.map((agent) => (
                                <motion.div
                                    key={agent.id}
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -20 }}
                                    className="agent-card"
                                >
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center space-x-2">
                                            <div className={`w-3 h-3 rounded-full ${getStatusColor(agent.status)}`}></div>
                                            <span className="font-semibold">{agent.name}</span>
                                        </div>
                                        <span className={`px-2 py-1 rounded text-xs ${
                                            agent.priority === 'critical' ? 'bg-red-600' :
                                            agent.priority === 'high' ? 'bg-orange-600' :
                                            agent.priority === 'medium' ? 'bg-yellow-600' :
                                            'bg-gray-600'
                                        }`}>
                                            {agent.priority}
                                        </span>
                                    </div>
                                    
                                    <div className="text-sm text-gray-300 mb-2">
                                        <div><strong>Role:</strong> {agent.role}</div>
                                        <div><strong>Portal:</strong> {agent.portal}</div>
                                        <div><strong>Task:</strong> {agent.assignedTask}</div>
                                    </div>
                                    
                                    <div className="mb-3">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>Progress</span>
                                            <span>{agent.progress}%</span>
                                        </div>
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{width: `${agent.progress}%`}}></div>
                                        </div>
                                    </div>
                                    
                                    <div className="text-xs text-gray-400">
                                        <div>Uptime: {agent.uptime}</div>
                                        <div>Errors: {agent.errors} | Warnings: {agent.warnings}</div>
                                        <div>Last Check-in: {new Date(agent.lastCheckIn).toLocaleTimeString()}</div>
                                    </div>
                                </motion.div>
                            ))}
                        </AnimatePresence>
                    </div>

                    {filteredAgents.length === 0 && (
                        <div className="text-center py-12">
                            <div className="text-6xl mb-4">🤖</div>
                            <h3 className="text-2xl font-semibold mb-2">No agents found</h3>
                            <p className="text-gray-400">Try adjusting your filters to see more agents.</p>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="mt-12 text-center text-gray-400">
                        <p>MCP Agents Dashboard • Last updated: {new Date().toLocaleString()}</p>
                        <p className="text-sm mt-2">302 Autonomous Agents • 24/7 Runtime • Full Lifecycle Coverage</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MCPDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
