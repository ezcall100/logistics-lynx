<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚛 TransBot AI - Advanced MCP Real-Time Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.3);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #3b82f6, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1rem;
            background: rgba(16, 185, 129, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            }
            50% { 
                opacity: 0.7; 
                transform: scale(1.2);
                box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
            }
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .dashboard-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .dashboard-card:hover::before {
            left: 100%;
        }

        .dashboard-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(148, 163, 184, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s ease;
        }

        .dashboard-card:hover .card-value {
            transform: scale(1.1);
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
            border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .agent-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .agent-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.6);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .agent-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .agent-status {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 2px solid rgba(16, 185, 129, 0.4);
            animation: statusPulse 2s infinite;
        }

        .status-working {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 2px solid rgba(59, 130, 246, 0.4);
            animation: statusPulse 1.5s infinite;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid rgba(239, 68, 68, 0.4);
            animation: statusShake 0.5s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes statusShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        .agent-role {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .agent-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .metric {
            text-align: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }

        .metric:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-feed {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 16px;
            padding: 2rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            animation: slideInLeft 0.4s ease;
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 8px;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .activity-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .activity-icon:hover {
            transform: scale(1.1);
        }

        .activity-icon.task {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 2px solid rgba(59, 130, 246, 0.4);
        }

        .activity-icon.complete {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 2px solid rgba(16, 185, 129, 0.4);
        }

        .activity-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid rgba(239, 68, 68, 0.4);
        }

        .activity-content {
            flex: 1;
        }

        .activity-message {
            color: #e2e8f0;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
        }

        .activity-time {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .real-time-indicator {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            animation: bounce 2s infinite;
            z-index: 1000;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-15px);
            }
            60% {
                transform: translateY(-7px);
            }
        }

        .system-alerts {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
            max-width: 350px;
        }

        .alert {
            background: rgba(30, 41, 59, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
            animation: slideInRight 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert.success {
            border-left: 6px solid #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .alert.warning {
            border-left: 6px solid #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .alert.error {
            border-left: 6px solid #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .refresh-button {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            z-index: 1000;
        }

        .refresh-button:hover {
            background: linear-gradient(45deg, #1d4ed8, #1e40af);
            transform: scale(1.15) rotate(180deg);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.6);
        }

        .live-data-stream {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 2rem;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            z-index: 2000;
            display: none;
            max-width: 600px;
            max-height: 400px;
            overflow: auto;
        }

        .live-data-stream.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .close-stream {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .real-time-indicator,
            .refresh-button {
                position: static;
                margin: 1rem;
                text-align: center;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #1d4ed8, #059669);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">🚛 TransBot AI</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>MCP Agents: LIVE STREAMING</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- Dashboard Overview -->
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">🚀 Active Agents</div>
                    <div class="card-value" id="activeAgents">0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="agentsProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">📋 Tasks Completed</div>
                    <div class="card-value" id="tasksCompleted">0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="tasksProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">⚡ System Performance</div>
                    <div class="card-value" id="systemPerformance">0%</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="performanceProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">⚠️ Error Rate</div>
                    <div class="card-value" id="errorRate">0%</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="errorProgress" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Agent Cards -->
        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be dynamically generated here -->
        </div>

        <!-- Activity Feed -->
        <div class="activity-feed">
            <div class="card-header">
                <div class="card-title">📡 Live Activity Feed</div>
            </div>
            <div id="activityFeed">
                <!-- Activity items will be dynamically generated here -->
            </div>
        </div>
    </div>

    <!-- Real-time indicator -->
    <div class="real-time-indicator">
        🔴 LIVE STREAMING
    </div>

    <!-- Refresh button -->
    <button class="refresh-button" onclick="refreshData()" title="Refresh Data">
        🔄
    </button>

    <!-- System alerts container -->
    <div class="system-alerts" id="systemAlerts"></div>

    <!-- Live data stream overlay -->
    <div class="live-data-stream" id="liveDataStream">
        <button class="close-stream" onclick="closeDataStream()">×</button>
        <h3>🔴 Live MCP Data Stream</h3>
        <div id="streamContent"></div>
    </div>

    <script type="module">
        // Import the MCP coordinator
        import { mcpV2Coordinator } from './src/agents/mcp-v2-coordinator.ts';
        
        // Global variables
        let mcpCoordinator = null;
        let updateInterval = null;
        let lastUpdateTime = Date.now();
        let activityHistory = [];
        let systemAlerts = [];
        let updateCounter = 0;
        let isStreaming = false;

        // DOM elements
        const activeAgentsEl = document.getElementById('activeAgents');
        const tasksCompletedEl = document.getElementById('tasksCompleted');
        const systemPerformanceEl = document.getElementById('systemPerformance');
        const errorRateEl = document.getElementById('errorRate');
        const agentsGridEl = document.getElementById('agentsGrid');
        const activityFeedEl = document.getElementById('activityFeed');
        const systemAlertsEl = document.getElementById('systemAlerts');
        const liveDataStreamEl = document.getElementById('liveDataStream');
        const streamContentEl = document.getElementById('streamContent');

        // Initialize MCP coordinator
        async function initializeMCP() {
            try {
                mcpCoordinator = mcpV2Coordinator;
                console.log('✅ Advanced MCP Coordinator initialized');
                
                // Start real-time updates with faster refresh
                startRealTimeUpdates();
                
                // Initial data load
                updateDashboard();
                updateAgents();
                updateActivityFeed();
                
                // Show welcome alert
                showAlert('Advanced MCP Real-Time Dashboard initialized successfully!', 'success');
                
            } catch (error) {
                console.error('❌ Failed to initialize MCP:', error);
                showAlert('Failed to initialize MCP system', 'error');
            }
        }

        // Start real-time updates with enhanced frequency
        function startRealTimeUpdates() {
            // Update every 1 second for ultra-real-time feel
            updateInterval = setInterval(() => {
                updateCounter++;
                updateDashboard();
                updateAgents();
                updateActivityFeed();
                checkForNewActivities();
                
                // Update live stream if active
                if (isStreaming) {
                    updateLiveStream();
                }
                
                // Add some randomness to simulate real-time data changes
                if (updateCounter % 10 === 0) {
                    simulateRealTimeChanges();
                }
                
            }, 1000);

            console.log('🚀 Ultra-fast real-time updates started (1 second intervals)');
        }

        // Simulate real-time changes for demonstration
        function simulateRealTimeChanges() {
            try {
                if (!mcpCoordinator) return;

                // Simulate agent status changes
                const agents = mcpCoordinator.getAllAgents();
                if (agents.length > 0) {
                    const randomAgent = agents[Math.floor(Math.random() * agents.length)];
                    if (randomAgent) {
                        // Simulate task completion
                        if (randomAgent.currentTasks > 0) {
                            randomAgent.currentTasks = Math.max(0, randomAgent.currentTasks - 1);
                            randomAgent.completedTasks += 1;
                            randomAgent.lastActivity = new Date();
                            
                            // Add to activity feed
                            addActivity(`Agent ${randomAgent.name} completed a task`, 'complete');
                        }
                    }
                }
            } catch (error) {
                console.error('Simulation error:', error);
            }
        }

        // Update dashboard overview with enhanced animations
        function updateDashboard() {
            try {
                if (!mcpCoordinator) return;

                const systemStatus = mcpCoordinator.getSystemStatus();
                const progressSummary = mcpCoordinator.getProgressSummary();

                // Update active agents with smooth transitions
                const activeAgents = systemStatus.activeAgents;
                const totalAgents = mcpCoordinator.getAllAgents().length;
                animateValue(activeAgentsEl, activeAgents);
                animateProgressBar('agentsProgress', (activeAgents / totalAgents) * 100);

                // Update tasks completed
                const completedTasks = progressSummary.completedTasks;
                const totalTasks = progressSummary.totalTasks;
                animateValue(tasksCompletedEl, completedTasks);
                animateProgressBar('tasksProgress', progressSummary.progressPercentage);

                // Update system performance
                const performance = systemStatus.performance;
                animateValue(systemPerformanceEl, `${performance}%`);
                animateProgressBar('performanceProgress', performance);

                // Update error rate
                const errorRate = (systemStatus.errorRate * 100).toFixed(1);
                animateValue(errorRateEl, `${errorRate}%`);
                animateProgressBar('errorProgress', systemStatus.errorRate * 100);

            } catch (error) {
                console.error('Dashboard update error:', error);
            }
        }

        // Animate value changes
        function animateValue(element, newValue) {
            if (element.textContent !== newValue.toString()) {
                element.style.transform = 'scale(1.1)';
                element.style.color = '#06b6d4';
                
                setTimeout(() => {
                    element.textContent = newValue;
                    element.style.transform = 'scale(1)';
                    element.style.color = '';
                }, 150);
            }
        }

        // Animate progress bar changes
        function animateProgressBar(id, newWidth) {
            const progressBar = document.getElementById(id);
            if (progressBar) {
                const currentWidth = parseFloat(progressBar.style.width) || 0;
                if (Math.abs(currentWidth - newWidth) > 1) {
                    progressBar.style.width = `${newWidth}%`;
                }
            }
        }

        // Update agent cards with enhanced animations
        function updateAgents() {
            try {
                if (!mcpCoordinator) return;

                const agents = mcpCoordinator.getAllAgents();
                const agentProgress = mcpCoordinator.getAgentProgress();

                agentsGridEl.innerHTML = agents.map((agent, index) => {
                    const progress = agentProgress.find(p => p.name === agent.name);
                    const statusClass = getStatusClass(agent.status);
                    
                    return `
                        <div class="agent-card" style="animation-delay: ${index * 0.1}s">
                            <div class="agent-header">
                                <div class="agent-name">${agent.name}</div>
                                <div class="agent-status ${statusClass}">${agent.status}</div>
                            </div>
                            <div class="agent-role">${agent.role}</div>
                            
                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Task Progress</span>
                                    <span>${progress ? progress.progress : 0}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress ? progress.progress : 0}%"></div>
                                </div>
                            </div>
                            
                            <div class="agent-metrics">
                                <div class="metric">
                                    <div class="metric-value">${agent.completedTasks}</div>
                                    <div class="metric-label">Completed</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${agent.currentTasks}</div>
                                    <div class="metric-label">Current</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${agent.performance}%</div>
                                    <div class="metric-label">Performance</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${Math.floor(agent.uptime / 60)}m</div>
                                    <div class="metric-label">Uptime</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Agents update error:', error);
            }
        }

        // Update activity feed with enhanced features
        function updateActivityFeed() {
            try {
                if (!mcpCoordinator) return;

                const recentActivity = mcpCoordinator.getRecentActivity();
                const currentTime = new Date();

                // Add new activities to history
                recentActivity.forEach(activity => {
                    if (!activityHistory.find(h => h.message === activity)) {
                        addActivity(activity, getActivityType(activity));
                    }
                });

                // Keep only last 25 activities
                if (activityHistory.length > 25) {
                    activityHistory = activityHistory.slice(0, 25);
                }

                // Render activities with enhanced animations
                renderActivities();

            } catch (error) {
                console.error('Activity feed update error:', error);
            }
        }

        // Add new activity
        function addActivity(message, type) {
            const newActivity = {
                message,
                timestamp: new Date(),
                type,
                id: Date.now() + Math.random()
            };
            
            activityHistory.unshift(newActivity);
            
            // Show notification for important activities
            if (type === 'error' || type === 'complete') {
                showAlert(message, type === 'error' ? 'error' : 'success');
            }
        }

        // Render activities with animations
        function renderActivities() {
            activityFeedEl.innerHTML = activityHistory.map((activity, index) => {
                const timeAgo = getTimeAgo(activity.timestamp);
                const icon = getActivityIcon(activity.type);
                
                return `
                    <div class="activity-item" style="animation-delay: ${index * 0.05}s">
                        <div class="activity-icon ${activity.type}">${icon}</div>
                        <div class="activity-content">
                            <div class="activity-message">${activity.message}</div>
                            <div class="activity-time">${timeAgo}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Check for new activities and show alerts
        function checkForNewActivities() {
            try {
                if (!mcpCoordinator) return;

                const systemStatus = mcpCoordinator.getSystemStatus();
                const currentTime = Date.now();

                // Check if this is a new update
                if (currentTime - lastUpdateTime > 3000) { // 3 seconds threshold
                    lastUpdateTime = currentTime;

                    // Check for system status changes
                    if (systemStatus.overallStatus === 'critical') {
                        showAlert('🚨 System status: CRITICAL - Immediate attention required', 'error');
                    } else if (systemStatus.overallStatus === 'recovering') {
                        showAlert('🔄 System status: RECOVERING - Auto-recovery in progress', 'warning');
                    } else if (systemStatus.overallStatus === 'operational') {
                        showAlert('✅ System status: OPERATIONAL - All systems normal', 'success');
                    }

                    // Check for performance issues
                    if (systemStatus.performance < 70) {
                        showAlert(`⚠️ Performance degraded: ${systemStatus.performance}%`, 'warning');
                    }

                    // Check for high error rates
                    if (systemStatus.errorRate > 0.1) {
                        showAlert(`❌ High error rate: ${(systemStatus.errorRate * 100).toFixed(1)}%`, 'error');
                    }
                }

            } catch (error) {
                console.error('Activity check error:', error);
            }
        }

        // Update live data stream
        function updateLiveStream() {
            try {
                if (!mcpCoordinator) return;

                const systemStatus = mcpCoordinator.getSystemStatus();
                const agents = mcpCoordinator.getAllAgents();
                const progressSummary = mcpCoordinator.getProgressSummary();

                const streamData = {
                    timestamp: new Date().toISOString(),
                    systemStatus,
                    agents: agents.map(agent => ({
                        name: agent.name,
                        status: agent.status,
                        performance: agent.performance,
                        tasks: {
                            completed: agent.completedTasks,
                            current: agent.currentTasks
                        }
                    })),
                    progress: progressSummary,
                    updateCounter
                };

                streamContentEl.innerHTML = `
                    <div style="margin-bottom: 1rem; color: #00ff00; font-weight: bold;">
                        Last Update: ${new Date().toLocaleTimeString()}
                    </div>
                    <pre style="color: #00ff00; font-size: 0.9rem; line-height: 1.4;">
${JSON.stringify(streamData, null, 2)}
                    </pre>
                `;

            } catch (error) {
                console.error('Live stream update error:', error);
            }
        }

        // Helper functions
        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'status-active';
                case 'working': return 'status-working';
                case 'error': return 'status-error';
                default: return 'status-active';
            }
        }

        function getActivityType(activity) {
            if (activity.includes('completed')) return 'complete';
            if (activity.includes('error') || activity.includes('failed')) return 'error';
            return 'task';
        }

        function getActivityIcon(type) {
            switch (type) {
                case 'complete': return '✅';
                case 'error': return '❌';
                default: return '📋';
            }
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);

            if (minutes > 0) {
                return `${minutes}m ${seconds}s ago`;
            }
            return `${seconds}s ago`;
        }

        // Show system alert with enhanced styling
        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 0.5rem; font-size: 1.1rem;">
                    ${type.toUpperCase()}
                </div>
                <div style="font-size: 1rem;">${message}</div>
            `;

            systemAlertsEl.appendChild(alert);

            // Remove alert after 6 seconds
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.style.animation = 'slideInRight 0.3s ease reverse';
                    setTimeout(() => {
                        if (alert.parentNode) {
                            alert.parentNode.removeChild(alert);
                        }
                    }, 300);
                }
            }, 6000);
        }

        // Refresh data manually
        window.refreshData = function() {
            updateDashboard();
            updateAgents();
            updateActivityFeed();
            showAlert('🔄 Data refreshed manually', 'success');
        };

        // Toggle live data stream
        window.toggleDataStream = function() {
            isStreaming = !isStreaming;
            if (isStreaming) {
                liveDataStreamEl.classList.add('show');
                updateLiveStream();
            } else {
                liveDataStreamEl.classList.remove('show');
            }
        };

        // Close data stream
        window.closeDataStream = function() {
            isStreaming = false;
            liveDataStreamEl.classList.remove('show');
        };

        // Initialize the system
        initializeMCP();

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Page hidden, pausing updates');
                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
            } else {
                console.log('Page visible, resuming updates');
                if (!updateInterval) {
                    startRealTimeUpdates();
                }
            }
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                refreshData();
            }
            if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                toggleDataStream();
            }
        });

        // Show keyboard shortcuts help
        setTimeout(() => {
            showAlert('💡 Keyboard shortcuts: Ctrl+R (Refresh), Ctrl+L (Live Stream)', 'info');
        }, 3000);
    </script>
</body>
</html>
