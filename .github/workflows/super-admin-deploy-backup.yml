name: Super Admin Portal Deployment (Optimized)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - rollback
      backup_file:
        description: 'Backup file for rollback (required for rollback)'
        required: false
        type: string

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'
  # Environment variables for secrets (avoids context access warnings)
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SUPABASE_PROJECT_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
  MONITORING_WEBHOOK: ${{ secrets.MONITORING_WEBHOOK }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  # Build and Test
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          VITE_APP_ENV: ${{ github.event.inputs.environment || 'staging' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: dist/

  # Database Migration
  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Run database migrations
        run: |
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ]; then
            supabase db push --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          else
            echo "⚠️ SUPABASE_PROJECT_REF not configured, skipping migration"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Run database seed
        run: |
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ]; then
            supabase db seed --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          else
            echo "⚠️ SUPABASE_PROJECT_REF not configured, skipping seed"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, database-migration]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: dist/

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod=false'
        continue-on-error: true

      - name: Deploy to Supabase (Staging)
        run: |
          if [ -n "${{ env.SUPABASE_PROJECT_REF_STAGING }}" ]; then
            supabase functions deploy --project-ref ${{ env.SUPABASE_PROJECT_REF_STAGING }}
          else
            echo "⚠️ SUPABASE_PROJECT_REF_STAGING not configured, skipping Supabase deployment"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Run smoke tests
        run: |
          pnpm test:e2e:staging

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🚀 Super Admin Portal deployed to staging successfully!'
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, database-migration]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: dist/

      - name: Create backup
        run: |
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ]; then
            supabase db dump --project-ref ${{ env.SUPABASE_PROJECT_REF }} --data-only > backup.sql
            gzip backup.sql
          else
            echo "⚠️ SUPABASE_PROJECT_REF not configured, skipping backup"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Upload backup to S3
        run: |
          if [ -n "${{ env.S3_BACKUP_BUCKET }}" ]; then
            aws s3 cp backup.sql.gz s3://${{ env.S3_BACKUP_BUCKET }}/backups/$(date +%Y%m%d_%H%M%S)_backup.sql.gz
          else
            echo "⚠️ S3_BACKUP_BUCKET not configured, skipping S3 upload"
          fi
        continue-on-error: true

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod=true'
        continue-on-error: true

      - name: Deploy to Supabase (Production)
        run: |
          if [ -n "${{ env.SUPABASE_PROJECT_REF }}" ]; then
            supabase functions deploy --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          else
            echo "⚠️ SUPABASE_PROJECT_REF not configured, skipping Supabase deployment"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Run production tests
        run: |
          pnpm test:e2e:production

      - name: Update monitoring
        run: |
          if [ -n "${{ env.MONITORING_WEBHOOK }}" ]; then
            curl -X POST "${{ env.MONITORING_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"service": "super-admin-portal", "status": "deployed", "version": "${{ github.sha }}"}'
          else
            echo "⚠️ MONITORING_WEBHOOK not configured, skipping monitoring update"
          fi
        continue-on-error: true

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🎉 Super Admin Portal deployed to production successfully!'
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # Rollback (Manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback Vercel deployment
        run: |
          if [ -n "${{ env.VERCEL_TOKEN }}" ] && [ -n "${{ env.VERCEL_ORG_ID }}" ]; then
            vercel rollback --token ${{ env.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
          else
            echo "⚠️ Vercel credentials not configured, skipping Vercel rollback"
          fi
        continue-on-error: true

      - name: Restore database backup
        run: |
          if [ -n "${{ env.S3_BACKUP_BUCKET }}" ] && [ -n "${{ github.event.inputs.backup_file }}" ] && [ -n "${{ env.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ env.DATABASE_URL }}" ]; then
            aws s3 cp s3://${{ env.S3_BACKUP_BUCKET }}/backups/${{ github.event.inputs.backup_file }} backup.sql.gz
            gunzip backup.sql.gz
            supabase db reset --project-ref ${{ env.SUPABASE_PROJECT_REF }} --db-url ${{ env.DATABASE_URL }}
          else
            echo "⚠️ Required credentials not configured, skipping database restore"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          channel: '#deployments'
          text: '⚠️ Super Admin Portal rolled back to previous version!'
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Cleanup artifacts
        run: |
          echo "🧹 Cleaning up build artifacts..."
          # Add cleanup logic here
