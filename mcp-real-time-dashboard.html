<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚛 TransBot AI - MCP Real-Time Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .dashboard-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .agent-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
        }

        .agent-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .agent-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .agent-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-working {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .agent-role {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .progress-section {
            margin-bottom: 1rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .agent-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric {
            text-align: center;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 0.25rem;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .activity-feed {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            animation: slideIn 0.3s ease;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .activity-icon.task {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .activity-icon.complete {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .activity-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .activity-content {
            flex: 1;
        }

        .activity-message {
            color: #e2e8f0;
            margin-bottom: 0.25rem;
        }

        .activity-time {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .real-time-indicator {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .system-alerts {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .alert {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
            animation: slideInRight 0.3s ease;
            max-width: 300px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert.success {
            border-left: 4px solid #10b981;
        }

        .alert.warning {
            border-left: 4px solid #f59e0b;
        }

        .alert.error {
            border-left: 4px solid #ef4444;
        }

        .refresh-button {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: rgba(59, 130, 246, 0.9);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .refresh-button:hover {
            background: rgba(59, 130, 246, 1);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 1rem;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">🚛 TransBot AI</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>MCP Agents: LIVE</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- Dashboard Overview -->
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">Active Agents</div>
                    <div class="card-value" id="activeAgents">0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="agentsProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">Tasks Completed</div>
                    <div class="card-value" id="tasksCompleted">0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="tasksProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">System Performance</div>
                    <div class="card-value" id="systemPerformance">0%</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="performanceProgress" style="width: 0%"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-title">Error Rate</div>
                    <div class="card-value" id="errorRate">0%</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="errorProgress" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Agent Cards -->
        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be dynamically generated here -->
        </div>

        <!-- Activity Feed -->
        <div class="activity-feed">
            <div class="card-header">
                <div class="card-title">Live Activity Feed</div>
            </div>
            <div id="activityFeed">
                <!-- Activity items will be dynamically generated here -->
            </div>
        </div>
    </div>

    <!-- Real-time indicator -->
    <div class="real-time-indicator">
        🔴 LIVE UPDATING
    </div>

    <!-- Refresh button -->
    <button class="refresh-button" onclick="refreshData()" title="Refresh Data">
        🔄
    </button>

    <!-- System alerts container -->
    <div class="system-alerts" id="systemAlerts"></div>

    <script type="module">
        // Import the MCP coordinator
        import { mcpV2Coordinator } from './src/agents/mcp-v2-coordinator.ts';
        
        // Global variables
        let mcpCoordinator = null;
        let updateInterval = null;
        let lastUpdateTime = Date.now();
        let activityHistory = [];
        let systemAlerts = [];

        // DOM elements
        const activeAgentsEl = document.getElementById('activeAgents');
        const tasksCompletedEl = document.getElementById('tasksCompleted');
        const systemPerformanceEl = document.getElementById('systemPerformance');
        const errorRateEl = document.getElementById('errorRate');
        const agentsGridEl = document.getElementById('agentsGrid');
        const activityFeedEl = document.getElementById('activityFeed');
        const systemAlertsEl = document.getElementById('systemAlerts');

        // Initialize MCP coordinator
        async function initializeMCP() {
            try {
                mcpCoordinator = mcpV2Coordinator;
                console.log('✅ MCP Coordinator initialized');
                
                // Start real-time updates
                startRealTimeUpdates();
                
                // Initial data load
                updateDashboard();
                updateAgents();
                updateActivityFeed();
                
            } catch (error) {
                console.error('❌ Failed to initialize MCP:', error);
                showAlert('Failed to initialize MCP system', 'error');
            }
        }

        // Start real-time updates
        function startRealTimeUpdates() {
            // Update every 2 seconds for real-time feel
            updateInterval = setInterval(() => {
                updateDashboard();
                updateAgents();
                updateActivityFeed();
                checkForNewActivities();
            }, 2000);

            console.log('🚀 Real-time updates started');
        }

        // Update dashboard overview
        function updateDashboard() {
            try {
                if (!mcpCoordinator) return;

                const systemStatus = mcpCoordinator.getSystemStatus();
                const progressSummary = mcpCoordinator.getProgressSummary();

                // Update active agents
                const activeAgents = systemStatus.activeAgents;
                const totalAgents = mcpCoordinator.getAllAgents().length;
                activeAgentsEl.textContent = activeAgents;
                document.getElementById('agentsProgress').style.width = `${(activeAgents / totalAgents) * 100}%`;

                // Update tasks completed
                const completedTasks = progressSummary.completedTasks;
                const totalTasks = progressSummary.totalTasks;
                tasksCompletedEl.textContent = completedTasks;
                document.getElementById('tasksProgress').style.width = `${progressSummary.progressPercentage}%`;

                // Update system performance
                const performance = systemStatus.performance;
                systemPerformanceEl.textContent = `${performance}%`;
                document.getElementById('performanceProgress').style.width = `${performance}%`;

                // Update error rate
                const errorRate = (systemStatus.errorRate * 100).toFixed(1);
                errorRateEl.textContent = `${errorRate}%`;
                document.getElementById('errorProgress').style.width = `${systemStatus.errorRate * 100}%`;

            } catch (error) {
                console.error('Dashboard update error:', error);
            }
        }

        // Update agent cards
        function updateAgents() {
            try {
                if (!mcpCoordinator) return;

                const agents = mcpCoordinator.getAllAgents();
                const agentProgress = mcpCoordinator.getAgentProgress();

                agentsGridEl.innerHTML = agents.map(agent => {
                    const progress = agentProgress.find(p => p.name === agent.name);
                    const statusClass = getStatusClass(agent.status);
                    
                    return `
                        <div class="agent-card">
                            <div class="agent-header">
                                <div class="agent-name">${agent.name}</div>
                                <div class="agent-status ${statusClass}">${agent.status}</div>
                            </div>
                            <div class="agent-role">${agent.role}</div>
                            
                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Task Progress</span>
                                    <span>${progress ? progress.progress : 0}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress ? progress.progress : 0}%"></div>
                                </div>
                            </div>
                            
                            <div class="agent-metrics">
                                <div class="metric">
                                    <div class="metric-value">${agent.completedTasks}</div>
                                    <div class="metric-label">Completed</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${agent.currentTasks}</div>
                                    <div class="metric-label">Current</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${agent.performance}%</div>
                                    <div class="metric-label">Performance</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${Math.floor(agent.uptime / 60)}m</div>
                                    <div class="metric-label">Uptime</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Agents update error:', error);
            }
        }

        // Update activity feed
        function updateActivityFeed() {
            try {
                if (!mcpCoordinator) return;

                const recentActivity = mcpCoordinator.getRecentActivity();
                const currentTime = new Date();

                // Add new activities to history
                recentActivity.forEach(activity => {
                    if (!activityHistory.find(h => h.message === activity)) {
                        activityHistory.unshift({
                            message: activity,
                            timestamp: currentTime,
                            type: getActivityType(activity)
                        });
                    }
                });

                // Keep only last 20 activities
                if (activityHistory.length > 20) {
                    activityHistory = activityHistory.slice(0, 20);
                }

                // Render activities
                activityFeedEl.innerHTML = activityHistory.map(activity => {
                    const timeAgo = getTimeAgo(activity.timestamp);
                    const icon = getActivityIcon(activity.type);
                    
                    return `
                        <div class="activity-item">
                            <div class="activity-icon ${activity.type}">${icon}</div>
                            <div class="activity-content">
                                <div class="activity-message">${activity.message}</div>
                                <div class="activity-time">${timeAgo}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Activity feed update error:', error);
            }
        }

        // Check for new activities and show alerts
        function checkForNewActivities() {
            try {
                if (!mcpCoordinator) return;

                const systemStatus = mcpCoordinator.getSystemStatus();
                const currentTime = Date.now();

                // Check if this is a new update
                if (currentTime - lastUpdateTime > 5000) { // 5 seconds threshold
                    lastUpdateTime = currentTime;

                    // Check for system status changes
                    if (systemStatus.overallStatus === 'critical') {
                        showAlert('System status: CRITICAL - Immediate attention required', 'error');
                    } else if (systemStatus.overallStatus === 'recovering') {
                        showAlert('System status: RECOVERING - Auto-recovery in progress', 'warning');
                    } else if (systemStatus.overallStatus === 'operational') {
                        showAlert('System status: OPERATIONAL - All systems normal', 'success');
                    }

                    // Check for performance issues
                    if (systemStatus.performance < 70) {
                        showAlert(`Performance degraded: ${systemStatus.performance}%`, 'warning');
                    }

                    // Check for high error rates
                    if (systemStatus.errorRate > 0.1) {
                        showAlert(`High error rate: ${(systemStatus.errorRate * 100).toFixed(1)}%`, 'error');
                    }
                }

            } catch (error) {
                console.error('Activity check error:', error);
            }
        }

        // Helper functions
        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'status-active';
                case 'working': return 'status-working';
                case 'error': return 'status-error';
                default: return 'status-active';
            }
        }

        function getActivityType(activity) {
            if (activity.includes('completed')) return 'complete';
            if (activity.includes('error') || activity.includes('failed')) return 'error';
            return 'task';
        }

        function getActivityIcon(type) {
            switch (type) {
                case 'complete': return '✅';
                case 'error': return '❌';
                default: return '📋';
            }
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);

            if (minutes > 0) {
                return `${minutes}m ${seconds}s ago`;
            }
            return `${seconds}s ago`;
        }

        // Show system alert
        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 0.5rem;">${type.toUpperCase()}</div>
                <div>${message}</div>
            `;

            systemAlertsEl.appendChild(alert);

            // Remove alert after 5 seconds
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.parentNode.removeChild(alert);
                }
            }, 5000);
        }

        // Refresh data manually
        window.refreshData = function() {
            updateDashboard();
            updateAgents();
            updateActivityFeed();
            showAlert('Data refreshed manually', 'success');
        };

        // Initialize the system
        initializeMCP();

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Page hidden, pausing updates');
                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
            } else {
                console.log('Page visible, resuming updates');
                if (!updateInterval) {
                    startRealTimeUpdates();
                }
            }
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
